name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Lint, tests (SQLite), red team, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (SQLite)
        run: pytest -m "not e2e"
      - name: Red team
        run: python -m atmpl redteam
      - name: Dependency audit
        # The project itself is installed editable and is not on PyPI; every dependency is audited.
        # Fail-first proof for this gate: docs/proof/pip_audit_gate.txt
        run: pip-audit --skip-editable --progress-spinner off

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          POSTGRES_USER: atmpl
          POSTGRES_PASSWORD: atmpl_ci
          POSTGRES_DB: atmpl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atmpl -d atmpl_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the postgres extra
        run: python -m pip install -e ".[dev,postgres]"
      - name: Pytest (PostgreSQL)
        env:
          ATMPL_TEST_DATABASE_URL: postgresql+psycopg://atmpl:atmpl_ci@127.0.0.1:5432/atmpl_ci
        run: pytest -m "not e2e"

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Pytest (e2e)
        run: pytest -m e2e
      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: var/e2e/
          if-no-files-found: warn

  image:
    name: Build image (and publish from main)
    runs-on: ubuntu-latest
    needs: [quality, postgres]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case the image name and derive its tags
        id: image
        run: |
          name=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          tags="$name:${{ github.sha }}"
          case "$GITHUB_REF" in
            refs/tags/v*)  tags="$tags,$name:${GITHUB_REF#refs/tags/}" ;;
            refs/heads/main) tags="$tags,$name:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build (and push on main or a version tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the built image
        run: |
          docker run -d --name atmpl-smoke -p 8000:8000 "${{ steps.image.outputs.name }}:${{ github.sha }}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:8000/ | grep -q "Ship governed automation"
          docker rm -f atmpl-smoke
