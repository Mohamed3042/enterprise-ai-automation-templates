name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (SQLite)
        run: pytest -m "not e2e"
      - name: Red team
        run: python -m atmpl redteam
      - name: Dependency audit
        # The project itself is installed editable and is not on PyPI; every dependency is audited.
        # Fail-first proof for this gate: docs/proof/pip_audit_gate.txt
        run: pip-audit --skip-editable --progress-spinner off
