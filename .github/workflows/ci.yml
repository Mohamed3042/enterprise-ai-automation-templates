name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Lint, tests (SQLite), red team, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (SQLite)
        run: pytest -m "not e2e"
      - name: Red team
        run: python -m atmpl redteam
      - name: Evals (scored, keyless on the mock provider)
        run: python -m atmpl evals run --out var/evals
      - name: Evals gate
        # Fail-first proof for this gate: docs/proof/evals_gate.txt
        run: python -m atmpl evals gate --min-pass 1.0 --report var/evals/latest.json
      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: var/evals/
          if-no-files-found: warn
      - name: Dependency audit
        # The project itself is installed editable and is not on PyPI; every dependency is audited.
        # Fail-first proof for this gate: docs/proof/pip_audit_gate.txt
        run: pip-audit --skip-editable --progress-spinner off

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          POSTGRES_USER: atmpl
          POSTGRES_PASSWORD: atmpl_ci
          POSTGRES_DB: atmpl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atmpl -d atmpl_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the postgres extra
        run: python -m pip install -e ".[dev,postgres]"
      - name: Pytest (PostgreSQL)
        env:
          ATMPL_TEST_DATABASE_URL: postgresql+psycopg://atmpl:atmpl_ci@127.0.0.1:5432/atmpl_ci
        run: pytest -m "not e2e"

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Pytest (e2e)
        run: pytest -m e2e
      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: var/e2e/
          if-no-files-found: warn

  k8s-smoke:
    name: Kubernetes (kubeconform + kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both overlays against the Kubernetes schemas
        run: |
          curl -sSLo kubeconform.tar.gz             https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          for overlay in dev prod; do
            echo "== $overlay =="
            kubectl kustomize "deploy/k8s/overlays/$overlay"               | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -
          done
      - name: Build the image for this commit
        run: docker build --target runtime -t atmpl:ci .
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: atmpl-ci
          node_image: kindest/node:v1.31.0
      - name: Load the image into the cluster
        run: kind load docker-image atmpl:ci --name atmpl-ci
      - name: Apply the dev overlay
        run: |
          kubectl kustomize deploy/k8s/overlays/dev             | sed 's#ghcr.io/mohamed3042/enterprise-ai-automation-templates:latest#atmpl:ci#'             | kubectl apply -f -
      - name: Wait for the rollout
        run: kubectl -n atmpl-dev rollout status deployment/atmpl --timeout=180s
      - name: Hit /ready and /metrics through a port-forward
        run: |
          kubectl -n atmpl-dev port-forward svc/atmpl 18080:80 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ready > /tmp/ready.json; then break; fi
            sleep 2
          done
          cat /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          curl -fsS http://127.0.0.1:18080/metrics | grep -q atmpl_http_requests_total
          curl -fsS http://127.0.0.1:18080/llmops | grep -q "LLMOps"
      - name: Describe and dump logs on failure
        if: failure()
        run: |
          kubectl -n atmpl-dev get pods -o wide
          kubectl -n atmpl-dev describe deployment/atmpl
          kubectl -n atmpl-dev logs -l app.kubernetes.io/name=atmpl --tail=200 || true

  live:
    name: Live provider (Gemini)
    runs-on: ubuntu-latest
    # Only where the secret exists: forks and PRs from forks run the keyless suite instead.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Live Gemini contract
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set for this repository; the hosted adapters stay"
            echo "contract-tested and this job is a no-op."
            exit 0
          fi
          pytest -m live -v
          python -m atmpl providers check --ping
      - name: Score the eval suite against the live provider (reported, not gated)
        # The gate is the deterministic keyless run in the `quality` job (docs/evals.md says
        # why). This run is a measurement against a hosted model: a provider timeout or a
        # 5xx is information about the provider, not a defect in this repository, and it
        # must not decide whether the build ships.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then exit 0; fi
          python -m atmpl evals run --provider gemini --out var/evals-live
      - name: Upload the live eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-live
          path: var/evals-live/
          if-no-files-found: ignore

  space:
    name: Publish the Hugging Face Space
    runs-on: ubuntu-latest
    needs: [image]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the hub client
        run: python -m pip install "huggingface_hub>=0.35,<1" httpx
      - name: Upload the Space and measure the live URL
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is not set for this repository; the Space is not re-deployed."
            echo "Set it with: gh secret set HF_TOKEN -R $GITHUB_REPOSITORY"
            exit 0
          fi
          python deploy/hf-space/push_space.py --attempts 30

  image:
    name: Build image (and publish from main)
    runs-on: ubuntu-latest
    needs: [quality, postgres]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case the image name and derive its tags
        id: image
        run: |
          name=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          tags="$name:${{ github.sha }}"
          case "$GITHUB_REF" in
            refs/tags/v*)  tags="$tags,$name:${GITHUB_REF#refs/tags/}" ;;
            refs/heads/main) tags="$tags,$name:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build (and push on main or a version tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the built image
        run: |
          docker run -d --name atmpl-smoke -p 8000:8000 "${{ steps.image.outputs.name }}:${{ github.sha }}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:8000/ | grep -q "Ship governed automation"
          docker rm -f atmpl-smoke
