# What a model returns, and what the deterministic gate does with it.
#
# The `provider_response` cases start from a recorded wire body, parse it with the shipped
# adapter, and put the parsed result through the same postflight a live answer would meet.
# That is how "the provider returned prose instead of JSON" is measured without a key.

category: output_integrity

cases:
  - id: E-OUT-01
    title: A model output claiming it already approved the case is refused
    probe: postflight
    rationale: >-
      The model asserts authority it does not have. It is caught because a drafting stage
      declares the fields it needs and this answer is not one of them -- the schema, not a
      phrase list, is what refuses it.
    args:
      required_fields: [summary, recommendation]
      output:
        summary: "I have approved this refund and issued the payment."
        status: APPROVED_AND_PAID
    expect:
      decision: blocked
      codes: [OUTPUT_SCHEMA]
      guardrail: G3

  - id: E-OUT-02
    title: A score outside its declared bounds is refused
    probe: postflight
    args:
      required_fields: [summary, completeness_score]
      numeric_bounds: { completeness_score: [0, 100] }
      output:
        summary: "Application reviewed."
        completeness_score: 999
    expect:
      decision: blocked
      codes: [NUMERIC_BOUNDS]

  - id: E-OUT-03
    title: A score returned as text is refused
    probe: postflight
    rationale: A number-shaped string is not a number; the bound check must not coerce.
    args:
      required_fields: [summary, completeness_score]
      numeric_bounds: { completeness_score: [0, 100] }
      output:
        summary: "Application reviewed."
        completeness_score: "86"
    expect:
      decision: blocked
      codes: [NUMERIC_BOUNDS]

