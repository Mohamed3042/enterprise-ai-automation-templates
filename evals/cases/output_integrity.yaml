  - id: E-OUT-05
    title: A provider that answers with prose instead of JSON produces no draft
    probe: provider_response
    rationale: >-
      Recorded OpenAI-shaped body whose `content` is not JSON. The adapter does not raise:
      it hands the text on as `raw_text`, and the postflight refuses it for the fields it
      is missing. A malformed answer is a blocked stage, never a crashed run.
    args:
      provider: openai
      required_fields: [summary, recommendation]
      body:
        id: chatcmpl-synthetic-eval-05
        model: gpt-4o-mini
        choices:
          - index: 0
            finish_reason: stop
            message:
              role: assistant
              content: "Sure! Here is my take: the refund looks fine to me."
        usage: { prompt_tokens: 412, completion_tokens: 18 }
    expect:
      decision: blocked
      codes: [OUTPUT_SCHEMA]

  - id: E-OUT-06
    title: A truncated JSON answer produces no draft
    probe: provider_response
    args:
      provider: anthropic
      required_fields: [summary, recommendation]
      body:
        id: msg_synthetic_eval_06
        model: claude-sonnet-5
        stop_reason: max_tokens
        content:
          - type: text
            text: '{"summary": "Application reviewed", "recommend'
        usage: { input_tokens: 388, output_tokens: 1024 }
    expect:
      decision: blocked
      codes: [OUTPUT_SCHEMA]

  - id: E-OUT-07
    title: A well-formed provider answer becomes a draft
    probe: provider_response
    rationale: The positive control for the whole parse-then-gate path.
    args:
      provider: gemini
      required_fields: [summary, recommendation]
      body:
        candidates:
          - finishReason: STOP
            content:
              role: model
              parts:
                - text: '{"summary": "Synthetic request classified for governed human review.", "recommendation": "REVIEW"}'
        usageMetadata: { promptTokenCount: 402, candidatesTokenCount: 31 }
    expect:
      decision: allowed
