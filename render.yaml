# Render Blueprint — the read-only public demo.
#
# This file has to live at the repository root: that is where Render looks for a Blueprint.
# The click path, and what to do when a Blueprint is not available to you, are in
# `deploy/render/README.md`.
#
# `runtime: docker`, not `runtime: image`. Deploying a *prebuilt* registry image asked for a
# card (measured 2026-09-06), and so did applying a Blueprint; building a Dockerfile from a
# connected repository is the plainly-free path. The property that mattered survives anyway,
# because `deploy/render/Dockerfile` is three lines of configuration on top of `FROM` the exact
# image CI published — the running bytes are still the ones that were tested.

services:
  - type: web
    name: atmpl-governed-automation
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Every environment variable the demo needs is baked into that Dockerfile, so a service
    # created by hand from the dashboard needs no form fields filled in and cannot be
    # mis-typed into a deployment that quietly is not read-only.
    envVars: []
