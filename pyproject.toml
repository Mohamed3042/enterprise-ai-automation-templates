[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-automation-templates"
version = "0.3.0"
description = "Governed, discovery-led enterprise AI automation templates"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohamed Mahmoud" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  # The instrumentation packages are pre-1.0 and versioned separately from the API/SDK;
  # they are pinned exactly because a beta bump has broken instrument_app before.
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-instrumentation-sqlalchemy==0.65b0",
  "prometheus-client>=0.26,<1",
  "pydantic>=2.9,<3",
  "pydantic-ai-slim>=2.40,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "pip-audit>=2.7,<3",
  "playwright>=1.48,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
atmpl = "atmpl.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atmpl = [
  "web/static/*",
  "web/templates/*",
  "migrations/*.py",
  "migrations/**/*.py",
  "migrations/*.mako",
  "providers/prices.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp -m \"not live\""
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
  "e2e: browser end-to-end tests (require `playwright install chromium`)",
  "live: calls a hosted model API (needs GEMINI_API_KEY; skipped otherwise)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/atmpl/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies and bodies as call-valued defaults; that is its contract.
"src/atmpl/api/routers/*.py" = ["B008"]

