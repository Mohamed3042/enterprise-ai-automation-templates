apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atmpl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atmpl
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # A governed queue is bursty; draining replicas the moment a burst ends just
      # re-pays the start-up cost on the next one.
      stabilizationWindowSeconds: 300
