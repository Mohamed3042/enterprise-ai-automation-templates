# TEMPLATE ONLY. Every value below is a visible placeholder, and the manifest is committed
# so the *shape* of the Secret is reviewable. Never commit a filled-in copy: supply the real
# values from your cluster's secret manager, a sealed secret, or:
#
#   kubectl create secret generic atmpl-secrets \
#     --from-literal=ATMPL_SECRET_JWT_SIGNING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ATMPL_SECRET_SESSION_SIGNING_KEY="$(openssl rand -hex 32)"
#
# The Deployment marks this Secret optional, so a cluster without it still starts — with
# process-lifetime signing keys, which `atmpl doctor` reports out loud as EPHEMERAL.
apiVersion: v1
kind: Secret
metadata:
  name: atmpl-secrets
type: Opaque
stringData:
  # Without these, tokens and sessions stop working on every restart.
  ATMPL_SECRET_JWT_SIGNING_KEY: "REPLACE_WITH_64_HEX_CHARS"
  ATMPL_SECRET_SESSION_SIGNING_KEY: "REPLACE_WITH_64_HEX_CHARS"
  # Dashboard login. With neither set, the dashboard runs as an open demo.
  ATMPL_ADMIN_USER: "REPLACE_OR_REMOVE"
  ATMPL_ADMIN_PASSWORD_HASH: "REPLACE_WITH_ATMPL_USERS_HASH_PASSWORD_OUTPUT"
  # Inbound webhook signing secrets, one per declared source.
  ATMPL_SECRET_WEBHOOK_INBOUND_HELPDESK: "REPLACE_OR_REMOVE"
  ATMPL_SECRET_WEBHOOK_INBOUND_CASE_INTAKE: "REPLACE_OR_REMOVE"
  # A hosted provider's key, only if this deployment uses one. The default is keyless.
  GEMINI_API_KEY: "REPLACE_OR_REMOVE"
