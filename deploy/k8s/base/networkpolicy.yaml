# Default-deny both ways, then allow exactly what this service needs. Written out rather
# than assumed: `/metrics` is open inside the cluster, so what keeps it off the internet is
# this policy plus the Ingress, not an authentication check.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atmpl-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atmpl
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atmpl-allow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atmpl
  policyTypes: [Ingress, Egress]
  ingress:
    # HTTP from the ingress controller and from anything scraping metrics in-cluster.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL, in-cluster.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Outbound HTTPS: signed webhook deliveries, and a hosted model provider when one is
    # configured. Remove this rule for a fully offline deployment on the mock provider.
    - ports:
        - protocol: TCP
          port: 443
