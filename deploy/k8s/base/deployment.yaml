apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmpl
  labels:
    app.kubernetes.io/name: atmpl
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atmpl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atmpl
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      # The image already runs as uid 10001; saying so here means a cluster policy that
      # rejects root-capable pods does not have to take the image's word for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atmpl
          image: ghcr.io/mohamed3042/enterprise-ai-automation-templates:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: atmpl-config
            - secretRef:
                name: atmpl-secrets
                optional: true
          # `/health` answers as long as the process serves; `/ready` also reaches the
          # database, so a Postgres outage takes the pod out of the Service without
          # restarting it.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The hash-chained ledger is a file, and the root filesystem is read-only.
            - name: var
              mountPath: /app/var
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var
          emptyDir: {}
        - name: tmp
          emptyDir: {}
