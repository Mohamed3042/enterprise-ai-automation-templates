apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmpl
  annotations:
    # The dashboard is server-rendered and the API is JSON; neither needs a large body.
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: atmpl.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atmpl
                port:
                  name: http
  tls:
    - hosts: [atmpl.example.invalid]
      secretName: atmpl-tls
